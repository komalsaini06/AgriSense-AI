        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

     ========================================== -->

    <h2>🌱 AgriSense AI</h2>

    <a href="index.html">

    <a href="schemes.html">
        🏛 Government Schemes
    </a>

</div>


<!-- ==========================================
     MAIN CONTENT
     ========================================== -->

<div class="main">


    <!-- ======================================
         PAGE HEADER
         ====================================== -->

    <div class="welcome">

        <h1>
            🌱 Crop Recommendation
        </h1>

        <p>
            AI based crop selection according to
            land conditions.
        </p>

    </div>


    <!-- ======================================
         SELECT DETAILS
         ====================================== -->

    <div class="card">

        <h2>
            Select Details
        </h2>


        <div class="crop-form">


            <!-- ==================================
                 LAND
                 ================================== -->

            <div class="form-group">

                <label for="land_select">
                    Land
                </label>

                <select id="land_select">

                    <option value="">
                        Select Land
                    </option>

                </select>

            </div>


            <!-- ==================================
                 SEASON
                 ================================== -->

            <div class="form-group">

                <label for="season">
                    Season
                </label>

                <select id="season">

                    <option value="">
                        Select Season
                    </option>

                    <option value="Kharif">
                        Kharif
                    </option>

                    <option value="Rabi">
                        Rabi
                    </option>

                    <option value="Zaid">
                        Zaid
                    </option>

                </select>

            </div>


            <!-- ==================================
                 IRRIGATION
                 ================================== -->

            <div class="form-group">

                <label for="irrigation">
                    Irrigation
                </label>

                <select id="irrigation">

                    <option value="">
                        Select Irrigation
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Moderate">
                        Moderate
                    </option>

                    <option value="Poor">
                        Poor
                    </option>

                </select>

            </div>


            <!-- ==================================
                 RECOMMEND BUTTON
                 ================================== -->

            <button
                type="button"
                id="recommendBtn"
            >

                🌱 Recommend Crop

            </button>


        </div>

    </div>


    <!-- ======================================
         RESULT
         ====================================== -->

    <div
        id="result"
        style="margin-top: 25px;"
    >

    </div>


</div>


<!-- ==========================================
     JAVASCRIPT
     ========================================== -->

<script src="crop.js"></script>


</body>

</html>
